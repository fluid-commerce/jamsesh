name: JamSesh release

# Builds the JamSesh Mac app on every change to main that reaches it, and replaces the
# "jamsesh-latest" release with it, so people download the newest build instead of building it.
# The download link stays the same:
#   https://github.com/fluid-commerce/jamsesh/releases/download/jamsesh-latest/JamSesh.dmg
# Apple Silicon only, signed ad hoc (no Apple Developer ID yet): the first open needs
# System Settings > Privacy & Security > Open Anyway.
on:
  push:
    branches: [main]
    paths:
      - "jamsesh/**"
      - "crates/**"
      - "apps/figcraft-web/**"
      - "apps/figcraft-server/**"
      - "apps/figcraft-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/jamsesh-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit's build matters: a newer push cancels the one still running.
concurrency:
  group: jamsesh-release
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      STAGE: ${{ runner.temp }}/jamsesh-stage
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            jamsesh/app/src-tauri -> target

      - uses: oven-sh/setup-bun@v2

      - name: Install trunk
        run: brew install trunk

      - name: Build FigCraft server and CLI
        run: cargo build --release --locked -p figcraft-server -p figcraft-cli

      - name: Build the browser canvas
        run: cd apps/figcraft-web && trunk build --release

      - name: Stage the parts the app carries
        run: |
          mkdir -p "$STAGE/bin" "$STAGE/models"
          cp target/release/figcraft-server target/release/figcraft-cli "$STAGE/bin/"
          cp -R dist/web "$STAGE/web-canvas"
          curl -fsSL -o "$STAGE/models/wespeaker_en.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx

      - name: Bundle the hub
        run: |
          cd jamsesh && bun install --frozen-lockfile
          JAMSESH_HOME="$STAGE" bash app/bundle-hub.sh

      - name: Build the app
        working-directory: jamsesh/app/src-tauri
        run: bunx @tauri-apps/cli@2 build --bundles app,dmg --config "{\"version\":\"$VERSION\"}"

      - name: Check the bundle starts its hub
        run: |
          APP=jamsesh/app/src-tauri/target/release/bundle/macos/JamSesh.app
          codesign --verify --deep --strict "$APP"
          HUB="$APP/Contents/Resources/jamsesh/hub/jamsesh-hub"
          JAMSESH_PORT=4799 JAMSESH_DATA="$RUNNER_TEMP/hubdata" JAMSESH_HOME="$RUNNER_TEMP/hubhome" JAMSESH_OFFLINE=1 \
            JAMSESH_RESOURCES="$APP/Contents/Resources/jamsesh" "$HUB" > "$RUNNER_TEMP/hub.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4799/healthz >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:4799/healthz >/dev/null || { cat "$RUNNER_TEMP/hub.log"; exit 1; }
          kill $pid

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls jamsesh/app/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          cp "$DMG" "$RUNNER_TEMP/JamSesh.dmg"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          JamSesh $VERSION for Macs with Apple Silicon, built from ${GITHUB_SHA::8}.

          **Install or update:** download JamSesh.dmg, open it, and drag JamSesh to Applications (replace the old one). Quit JamSesh first if it's running.

          **First open:** macOS says it can't check the app for malicious software, because the app isn't signed with an Apple Developer ID yet. Click Done, then open **System Settings > Privacy & Security** and click **Open Anyway** next to JamSesh. After each update, macOS may ask again for the microphone and to use JamSesh's saved sign-in (choose **Always Allow**).
          EOF
          gh release delete jamsesh-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create jamsesh-latest "$RUNNER_TEMP/JamSesh.dmg" \
            --target "$GITHUB_SHA" --title "JamSesh $VERSION (latest)" --notes-file "$RUNNER_TEMP/notes.md" --latest
