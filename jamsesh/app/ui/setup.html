<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>Set up this Mac</title>
    <style>
      :root {
        --bg: #0c0d0f;
        --panel: #16181b;
        --panel-2: #1c1f23;
        --panel-3: #24282d;
        --line: rgba(255, 255, 255, 0.07);
        --line-2: rgba(255, 255, 255, 0.12);
        --text: #f3f2ef;
        --muted: #a3a6ac;
        --faint: #6d7076;
        --built: #45e0a0;
        --warn: #ff6b5e;
        --amber: #f5b14c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
      main { height: 100%; display: flex; flex-direction: column; padding: 48px 32px 24px; gap: 18px; }
      h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
      .lede { margin: 4px 0 0; color: var(--muted); }
      .progress { height: 4px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
      .progress div { height: 100%; width: 0; background: var(--built); transition: width 0.3s; }
      .list { display: grid; gap: 8px; overflow: auto; flex: 1; min-height: 0; align-content: start; }
      .row { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
      .row.done { opacity: 0.72; }
      .icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); color: var(--muted); }
      .icon svg { width: 18px; height: 18px; }
      .row.done .icon { background: rgba(69, 224, 160, 0.14); color: var(--built); }
      .title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .why { color: var(--muted); font-size: 12.5px; }
      .tag { font-size: 11px; font-weight: 600; color: var(--faint); border: 1px solid var(--line-2); border-radius: 99px; padding: 0 7px; }
      .actions { display: flex; gap: 6px; }
      button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
      button:hover { background: var(--panel-3); }
      button.primary { background: var(--text); color: #111; border-color: transparent; }
      .ok { color: var(--built); font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      .note { color: var(--amber); font-size: 12.5px; margin-top: 2px; }
      footer { display: flex; align-items: center; gap: 10px; margin-top: auto; }
      footer .hint { flex: 1; color: var(--faint); font-size: 12.5px; }
      footer button { height: 38px; padding: 0 18px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div data-tauri-drag-region style="position:fixed;top:0;left:0;right:0;height:36px;z-index:5"></div>
    <main>
      <div>
        <h1>Let JamSesh run this Mac</h1>
        <p class="lede">The room brain can arrange windows, build previews, open the iPhone Simulator, and share this screen. macOS asks you to allow each one once.</p>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="list" id="list"></div>
      <footer>
        <span class="hint" id="hint">You can come back here any time from JamSesh's menu bar menu.</span>
        <button id="skip">Skip for now</button>
        <button class="primary" id="done">Done</button>
      </footer>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      const ICON = {
        mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
        cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>',
        win: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>',
        bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
        screen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
        globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>',
        hammer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 7 3 3-9 9-3-3z"/><path d="m13 4 7 7-2 2-7-7z"/></svg>',
      };
      const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
      const ITEMS = [
        { key: "microphone", icon: "mic", title: "Microphone", why: "Lets the room mic on this Mac hear the room." },
        { key: "accessibility", icon: "win", title: "Accessibility", why: "Moves and resizes app windows when the brain lays out the screen." },
        { key: "automation", icon: "bolt", title: "Automation", why: "Lets JamSesh tell System Events where windows go." },
        { key: "screen", icon: "screen", title: "Screen Recording", why: "Shares this screen and lets the brain see what's on it.", relaunch: true },
        { key: "camera", icon: "cam", title: "Camera", why: "Profile photos and camera sharing.", optional: true },
        { key: "devtools", icon: "hammer", title: "Xcode", why: "Builds previews and runs the iPhone Simulator.", optional: true, install: true },
        { key: "remote", icon: "globe", title: "Remote access", why: "A secure address so people outside this network, and phones, can join.", optional: true, action: "Set up" },
      ];
      const tried = new Set();
      let needsRelaunch = false;

      function row(item, state) {
        const done = state === "granted";
        const el = document.createElement("div");
        el.className = "row" + (done ? " done" : "");
        const note =
          item.key === "screen" && needsRelaunch && !done
            ? '<div class="note">Reopen JamSesh to finish turning this on.</div>'
            : !done && tried.has(item.key) && state !== "missing"
              ? `<div class="note">Turn on JamSesh in the list System Settings shows. Already on? Select it, click −, then click Allow here again.</div>`
              : "";
        el.innerHTML = `<div class="icon">${ICON[item.icon]}</div>
          <div><div class="title">${item.title}${item.optional ? '<span class="tag">Optional</span>' : ""}</div><div class="why">${item.why}</div>${note}</div>
          <div class="actions"></div>`;
        const actions = el.querySelector(".actions");
        if (done) {
          actions.innerHTML = `<span class="ok">${CHECK} ${item.install ? "Ready" : "Allowed"}</span>`;
        } else if (item.key === "screen" && needsRelaunch) {
          const b = document.createElement("button");
          b.className = "primary";
          b.textContent = "Reopen";
          b.onclick = () => invoke("relaunch");
          actions.append(b);
        } else {
          const allow = document.createElement("button");
          allow.className = "primary";
          allow.textContent = item.action ? item.action : item.install ? "Get Xcode" : tried.has(item.key) || state === "denied" ? "Open Settings" : "Allow";
          allow.onclick = async () => {
            if (item.key === "remote") return invoke("remote_setup");
            if (allow.textContent === "Open Settings") return invoke("perm_settings", { kind: item.key });
            tried.add(item.key);
            await invoke("perm_request", { kind: item.key });
            // macOS applies Screen Recording only once JamSesh reopens.
            if (item.relaunch) needsRelaunch = true;
            refresh();
          };
          actions.append(allow);
        }
        return el;
      }

      async function refresh() {
        let s;
        try {
          s = await invoke("perm_status");
        } catch {
          return;
        }
        const list = document.getElementById("list");
        list.replaceChildren(...ITEMS.map((i) => row(i, s[i.key])));
        const required = ITEMS.filter((i) => !i.optional);
        const n = required.filter((i) => s[i.key] === "granted").length;
        document.getElementById("bar").style.width = `${(n / required.length) * 100}%`;
        document.getElementById("hint").textContent =
          n === required.length ? "All set. The room brain can run this Mac." : `${n} of ${required.length} required permissions allowed. You can come back here from JamSesh's menu bar menu.`;
      }

      document.getElementById("done").onclick = () => invoke("finish_setup");
      document.getElementById("skip").onclick = () => invoke("finish_setup");
      window.addEventListener("focus", refresh);
      refresh();
      setInterval(refresh, 1500);
    </script>
  </body>
</html>
